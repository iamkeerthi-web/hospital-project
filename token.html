<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHER-SHA Swasthya Queue | Hospital Token System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f4f8; color: #1e293b; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        .header { background: linear-gradient(135deg, #dc2626, #991b1b); color: white; padding: 20px; text-align: center; border-radius: 12px 12px 0 0; }
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .header p { font-size: 14px; opacity: 0.9; }
        .card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .tabs { display: flex; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: #e2e8f0; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #dc2626; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        label { display: block; margin: 12px 0 6px; font-weight: 600; color: #475569; }
        input, select { width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 16px; }
        input:focus, select:focus { outline: none; border-color: #dc2626; }
        .btn { width: 100%; padding: 14px; background: #dc2626; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn:hover { background: #b91c1c; }
        .btn-admin { background: #1e40af; }
        .btn-admin:hover { background: #1e3a8a; }
        .token-card { background: #fef2f2; border: 2px dashed #dc2626; padding: 20px; text-align: center; border-radius: 12px; margin-top: 20px; }
        .token-number { font-size: 36px; font-weight: bold; color: #dc2626; margin: 10px 0; }
        .priority { background: #dc2626; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; display: inline-block; margin-bottom: 10px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; text-align: left; }
        .info-item { background: #f8fafc; padding: 10px; border-radius: 8px; }
        .info-label { font-size: 12px; color: #64748b; }
        .info-value { font-size: 18px; font-weight: bold; color: #1e293b; }
        .status { padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; margin-top: 15px; }
        .status.green { background: #dcfce7; color: #166534; }
        .status.yellow { background: #fef3c7; color: #92400e; }
        .status.red { background: #fee2e2; color: #991b1b; }
        .queue-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .queue-table th, .queue-table td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .queue-table th { background: #f1f5f9; }
        .footer { text-align: center; margin-top: 30px; font-size: 12px; color: #64748b; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🦁 SHER-SHA Swasthya Queue</h1>
            <p>Line mein bimari badhti hai, SHER-SHA time bachata hai</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('patient')">Patient Token</button>
            <button class="tab-btn" onclick="showTab('admin')">Admin Panel</button>
        </div>

        <!-- PATIENT TAB -->
        <div id="patient" class="tab-content active">
            <div class="card">
                <h3>Get Your Hospital Token</h3>
                <label>Patient Name</label>
                <input type="text" id="patientName" placeholder="Enter full name">
                
                <label>Phone Number</label>
                <input type="tel" id="patientPhone" placeholder="10 digit mobile">
                
                <label>Department</label>
                <select id="department">
                    <option value="OPD">General OPD</option>
                    <option value="CARDIO">Cardiology</option>
                    <option value="ORTHO">Orthopedics</option>
                    <option value="EMG">Emergency</option>
                </select>

                <label style="display: flex; align-items: center; margin-top: 15px;">
                    <input type="checkbox" id="isEmergency" style="width: auto; margin-right: 10px;">
                    Emergency Case - Priority Token
                </label>

                <button class="btn" onclick="generateToken()">Get My Token</button>
            </div>

            <div id="tokenResult" class="hidden"></div>
        </div>

        <!-- ADMIN TAB -->
        <div id="admin" class="tab-content">
            <div class="card" id="adminLogin">
                <h3>Admin Login</h3>
                <label>Username</label>
                <input type="text" id="adminUser" placeholder="admin">
                <label>Password</label>
                <input type="password" id="adminPass" placeholder="admin123">
                <button class="btn btn-admin" onclick="adminLogin()">Login</button>
            </div>

            <div id="adminPanel" class="hidden">
                <div class="card">
                    <h3>Queue Management</h3>
                    <label>Select Department</label>
                    <select id="adminDept" onchange="refreshAdmin()">
                        <option value="OPD">General OPD</option>
                        <option value="CARDIO">Cardiology</option>
                        <option value="ORTHO">Orthopedics</option>
                        <option value="EMG">Emergency</option>
                    </select>
                    
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Current Serving</div>
                            <div class="info-value" id="currentServing">-</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Total Waiting</div>
                            <div class="info-value" id="totalWaiting">0</div>
                        </div>
                    </div>

                    <button class="btn btn-admin" onclick="callNext()">Call Next Patient</button>
                    <button class="btn" style="background:#64748b; margin-top:10px;" onclick="resetQueue()">Reset Queue</button>
                </div>

                <div class="card">
                    <h3>Live Queue</h3>
                    <table class="queue-table">
                        <thead>
                            <tr><th>Token</th><th>Name</th><th>Status</th></tr>
                        </thead>
                        <tbody id="queueList"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="footer">
            Built by Team SHER-SHA | Saving Lives, Saving Time | NX Hackathon 2026
        </div>
    </div>

    <script>
        // SHER-SHA HOSPITAL QUEUE LOGIC - 3NF CONCEPT USED
        // Table 1: Patients, Table 2: Queue, Table 3: Departments
        
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
            if(tabName === 'admin') refreshAdmin();
        }

        function generateToken() {
            const name = document.getElementById('patientName').value.trim();
            const phone = document.getElementById('patientPhone').value.trim();
            const dept = document.getElementById('department').value;
            const isEmergency = document.getElementById('isEmergency').checked;
            
            if(!name || !phone) {
                alert('Bhai Name aur Phone toh daal de');
                return;
            }

            // Get existing queue from LocalStorage
            let queue = JSON.parse(localStorage.getItem('sherShaQueue_' + dept) || '[]');
            let currentNum = parseInt(localStorage.getItem('sherShaCurrent_' + dept) || '0');
            
            // Generate token number
            let tokenNum = queue.length + currentNum + 1;
            let prefix = isEmergency ? 'E-' : dept + '-';
            let token = prefix + String(tokenNum).padStart(3, '0');
            
            // Add to queue - Emergency goes to front
            const patient = { token, name, phone, dept, isEmergency, timestamp: Date.now() };
            if(isEmergency) {
                queue.unshift(patient);
            } else {
                queue.push(patient);
            }
            
            localStorage.setItem('sherShaQueue_' + dept, JSON.stringify(queue));
            
            // Calculate wait time: 5 min per patient
            let patientsAhead = isEmergency ? 0 : queue.length - 1;
            let waitTime = patientsAhead * 5;
            let currentServing = prefix + String(currentNum).padStart(3, '0');
            
            // Show result
            let statusClass = waitTime < 30 ? 'green' : waitTime < 60 ? 'yellow' : 'red';
            let statusText = waitTime < 30 ? '🟢 Jaldi aa jao' : waitTime < 60 ? '🟡 Chai pee ke aao' : '🔴 Ghar pe rest karo';
            
            document.getElementById('tokenResult').innerHTML = `
                <div class="token-card">
                    ${isEmergency ? '<div class="priority">PRIORITY EMERGENCY</div>' : ''}
                    <div>Hi ${name}, Your Token:</div>
                    <div class="token-number">${token}</div>
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Current Serving</div>
                            <div class="info-value">${currentServing}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Patients Ahead</div>
                            <div class="info-value">${patientsAhead}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Est. Wait Time</div>
                            <div class="info-value">${waitTime} mins</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Department</div>
                            <div class="info-value">${dept}</div>
                        </div>
                    <div class="status ${statusClass}">${statusText}</div>
                    <p style="margin-top:15px; font-size:12px; color:#64748b;">Page refresh karke status check karte raho</p>
                </div>
            `;
            document.getElementById('tokenResult').classList.remove('hidden');
            
            // Auto refresh patient data every 15 sec
            setTimeout(() => location.reload(), 15000);
        }

        function adminLogin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            if(user === 'admin' && pass === 'admin123') {
                document.getElementById('adminLogin').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                refreshAdmin();
            } else {
                alert('Galat username ya password. Hint: admin / admin123');
            }
        }

        function refreshAdmin() {
            const dept = document.getElementById('adminDept').value;
            let queue = JSON.parse(localStorage.getItem('sherShaQueue_' + dept) || '[]');
            let currentNum = parseInt(localStorage.getItem('sherShaCurrent_' + dept) || '0');
            
            let prefix = dept === 'EMG' ? 'E-' : dept + '-';
            document.getElementById('currentServing').textContent = prefix + String(currentNum).padStart(3, '0');
            document.getElementById('totalWaiting').textContent = queue.length;
            
            // Show queue list
            let html = '';
            queue.slice(0, 10).forEach(p => {
                html += `<tr>
                    <td>${p.token}</td>
                    <td>${p.name}</td>
                    <td>${p.isEmergency ? '<span style="color:#dc2626;font-weight:bold;">EMERGENCY</span>' : 'Waiting'}</td>
                </tr>`;
            });
            document.getElementById('queueList').innerHTML = html || '<tr><td colspan="3">No patients in queue</td></tr>';
        }

        function callNext() {
            const dept = document.getElementById('adminDept').value;
            let queue = JSON.parse(localStorage.getItem('sherShaQueue_' + dept) || '[]');
            let currentNum = parseInt(localStorage.getItem('sherShaCurrent_' + dept) || '0');
            
            if(queue.length === 0) {
                alert('Queue khali hai bhai. Koi patient nahi hai.');
                return;
            }
            
            // Remove first patient - FIFO
            queue.shift();
            currentNum++;
            
            localStorage.setItem('sherShaQueue_' + dept, JSON.stringify(queue));
            localStorage.setItem('sherShaCurrent_' + dept, currentNum);
            
            refreshAdmin();
            alert('Next patient called! Token: ' + (dept === 'EMG' ? 'E-' : dept + '-') + String(currentNum).padStart(3, '0'));
        }

        function resetQueue() {
            if(confirm('Saari queue delete ho jayegi. Pakka?')) {
                const dept = document.getElementById('adminDept').value;
                localStorage.removeItem('sherShaQueue_' + dept);
                localStorage.setItem('sherShaCurrent_' + dept, '0');
                refreshAdmin();
            }
        }

        // Auto refresh patient token if exists
        window.onload = function() {
            if(document.getElementById('tokenResult').innerHTML !== '') {
                setTimeout(() => location.reload(), 15000);
            }
        }
    </script>
</body>
</html>
